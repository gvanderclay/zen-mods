pre-commit:
  parallel: true
  jobs:
    # dist/ is committed, so a source change that skips the rebuild ships stale.
    # stage_fixed only re-stages files the job was handed, and dist/ is not one of
    # them, so the rebuilt bundle is staged explicitly.
    - name: build
      glob: "{mods/*/src/**/*.ts,mods/*/build.mjs,mods/*/tsconfig.json}"
      run: npm run build && git add mods/*/dist

    - name: lint
      glob: "**/*.{ts,mjs,json}"
      run: npx biome check --no-errors-on-unmatched {staged_files}

    - name: docs
      glob: "**/*.md"
      run: npx markdownlint-cli2 {staged_files}

pre-push:
  jobs:
    - name: check
      run: npm run check
